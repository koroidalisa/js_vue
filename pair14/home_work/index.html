<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="course-card" id="card">
    <p class="tag">Налаштування профілю</p>
    <p id="welcome">Вітаємо, гостю!</p>

    <label for="studentsName">Ваше ім'я</label>
    <input id="studentsName" type="text" placeholder="Введіть ім'я">

    <button id="enrollBtn">Змінити</button>
    <p id="status">Стара версія профілю</p>


    <label for="format">Колір теми</label>
    <select id="format">
        <option value="світла">Світла</option>
        <option value="темна">Темна</option>
    </select>
    <p>Тема: <strong id="price">світла</strong></p>


    <button id="detailBtn" class="secondary">Показати додаткову інформацію</button>
    <p class="hidden" id="details">У вас чудовий профіль!!</p>



</main>


<script src="script.js" defer></script>
</body>
</html>
